<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/png" href="/assets/podoo-64.png" />
		<title>Activar micrófono · Podoo</title>
		<style>
			:root {
				font-family: system-ui, sans-serif;
				color: #172b29;
				background: #f4f8f7;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
			}
			main {
				box-sizing: border-box;
				width: min(440px, calc(100vw - 32px));
				padding: 32px;
				border: 1px solid #d8e6e2;
				border-radius: 20px;
				background: white;
				box-shadow: 0 16px 48px #173e3414;
			}
			h1 {
				margin: 0 0 12px;
				font-size: 24px;
			}
			p {
				line-height: 1.5;
				color: #4b625d;
			}
			button {
				margin-top: 12px;
				padding: 12px 20px;
				border: 0;
				border-radius: 10px;
				background: #11634f;
				color: white;
				font: inherit;
				font-weight: 650;
				cursor: pointer;
			}
			button:disabled {
				opacity: 0.6;
				cursor: wait;
			}
			#status {
				min-height: 24px;
				font-size: 14px;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Activar micrófono para Podoo</h1>
			<p>
				Chrome solicita este permiso en una pestaña de la extensión. Pulsa el botón y elige
				<strong>Permitir</strong> cuando aparezca el aviso.
			</p>
			<button id="allow" type="button">Permitir micrófono</button>
			<p id="status" role="status" aria-live="polite"></p>
		</main>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
